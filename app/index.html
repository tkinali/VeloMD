<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>VeloMD</title>
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" data-theme-css="github-light" href="css/preview-themes/github-light.css">
<link rel="stylesheet" data-theme-css="github-dark" href="css/preview-themes/github-dark.css">
<link rel="stylesheet" data-theme-css="monokai" href="css/preview-themes/monokai.css">
<link rel="stylesheet" data-theme-css="dracula" href="css/preview-themes/dracula.css">
<link rel="stylesheet" data-theme-css="solarized-light" href="css/preview-themes/solarized-light.css">
<link rel="stylesheet" data-theme-css="solarized-dark" href="css/preview-themes/solarized-dark.css">
<link rel="stylesheet" data-theme-css="nord" href="css/preview-themes/nord.css">
<link rel="stylesheet" data-theme-css="one-dark" href="css/preview-themes/one-dark.css">
</head>
<body>

<header id="titlebar">
  <div id="brand">
    <img src="../logo.png" alt="VeloMD" id="logo">
    <span id="app-name">Velo<em>MD</em></span>
  </div>
  <nav id="tabbar" aria-label="open files"></nav>
  <button id="tab-new" data-i18n-title="menu.newTab" title="Yeni sekme (Ctrl+T)">+</button>
  <div id="titlebar-right">
    <button class="icon-btn" id="btn-open" data-i18n-title="menu.open" title="Dosya aç (Ctrl+O)">
      <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="icon-btn" id="btn-save" data-i18n-title="menu.save" title="Kaydet (Ctrl+S)">
      <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" data-i18n-title="menu.settings" title="Ayarlar (Ctrl+,)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div id="toolbar">
  <button class="tb-btn" data-md="bold" data-i18n-title="tb.bold" title="Kalın (Ctrl+B)"><svg viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg></button>
  <button class="tb-btn" data-md="italic" data-i18n-title="tb.italic" title="İtalik (Ctrl+I)"><svg viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></button>
  <button class="tb-btn" data-md="strike" data-i18n-title="tb.strike" title="Üstü çizili"><svg viewBox="0 0 24 24"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg></button>
  <button class="tb-btn" data-md="code" data-i18n-title="tb.code" title="Satır içi kod"><svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></button>
  <span class="tb-sep"></span>
  <button class="tb-btn wide" data-md="h1" data-i18n-title="tb.h1" title="1. başlık">H1</button>
  <button class="tb-btn wide" data-md="h2" data-i18n-title="tb.h2" title="2. başlık">H2</button>
  <button class="tb-btn wide" data-md="h3" data-i18n-title="tb.h3" title="3. başlık">H3</button>
  <button class="tb-btn wide" data-md="h4" data-i18n-title="tb.h4" title="4. başlık">H4</button>
  <button class="tb-btn wide" data-md="h5" data-i18n-title="tb.h5" title="5. başlık">H5</button>
  <span class="tb-sep"></span>
  <button class="tb-btn" data-md="quote" data-i18n-title="tb.quote" title="Alıntı"><svg viewBox="0 0 24 24"><line x1="7" y1="5" x2="7" y2="19"/><line x1="11" y1="7" x2="18" y2="7"/><line x1="11" y1="11" x2="20" y2="11"/><line x1="11" y1="15" x2="15" y2="15"/></svg></button>
  <button class="tb-btn" data-md="ul" data-i18n-title="tb.ul" title="Madde listesi"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
  <button class="tb-btn" data-md="ol" data-i18n-title="tb.ol" title="Numaralı liste"><svg viewBox="0 0 24 24"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="4" y="8" class="tb-num">1.</text><text x="4" y="14" class="tb-num">2.</text><text x="4" y="20" class="tb-num">3.</text></svg></button>
  <span class="tb-wrap" id="fence-wrap">
    <button class="tb-btn wide" id="btn-fence" data-i18n-title="tb.fence" title="Kod bloğu (dil seç)">``` ▾</button>
    <div class="lang-menu hidden" id="lang-menu"></div>
  </span>
  <span class="tb-sep"></span>
  <button class="tb-btn" data-md="link" data-i18n-title="tb.link" title="Bağlantı (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
  <button class="tb-btn" data-md="image" data-i18n-title="tb.image" title="Resim"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
  <button class="tb-btn" data-md="hr" data-i18n-title="tb.hr" title="Yatay çizgi"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <span class="tb-sep"></span>
  <button class="tb-btn" id="btn-pdf" data-i18n-title="tb.pdf" title="Önizlemeyi PDF olarak kaydet"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
  <button class="tb-btn" id="btn-preview" data-i18n-title="tb.preview" title="Önizlemeyi göster/gizle"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></svg></button>
</div>

<main id="split">
  <section id="editor-pane">
    <div id="ed-search" class="hidden">
      <div class="eds-row">
        <span class="eds-label" data-i18n="ed.findLabel">Bul</span>
        <input id="ed-find-input" type="text" data-i18n-ph="ed.findPh" placeholder="Ara…" autocomplete="off">
        <span id="ed-find-count">0/0</span>
        <button tabindex="-1" class="pvs-btn" id="ed-find-prev" data-i18n-title="pv.prev" title="Önceki (Shift+Enter)"><svg viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"/></svg></button>
        <button tabindex="-1" class="pvs-btn" id="ed-find-next" data-i18n-title="pv.next" title="Sonraki (Enter)"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
        <button tabindex="-1" class="pvs-btn" id="ed-search-close" data-i18n-title="pv.close" title="Kapat (Esc)"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="eds-row">
        <span class="eds-label" data-i18n="ed.replaceLabel">Değiştir</span>
        <input id="ed-replace-input" type="text" data-i18n-ph="ed.replacePh" placeholder="yeni metin" autocomplete="off">
        <button tabindex="-1" class="eds-btn" id="ed-replace-one" data-i18n="ed.replaceOne">Değiştir</button>
        <button tabindex="-1" class="eds-btn" id="ed-replace-all" data-i18n="ed.replaceAll">Tümünü değiştir</button>
      </div>
    </div>
    <textarea id="cm-host" spellcheck="false"></textarea>
  </section>
  <div id="divider" data-i18n-title="divider.hint" title="Bölümü sürükleyerek ayarla · çift tık: eşit böl"></div>
  <section id="preview-pane">
    <div id="preview" class="markdown-body"></div>
  </section>
  <div id="pv-search" class="hidden">
    <input id="pv-search-input" type="text" data-i18n-ph="pv.searchPh" placeholder="Önizlemede ara…" autocomplete="off">
    <span id="pv-search-count">0/0</span>
    <button tabindex="-1" class="pvs-btn" id="pv-search-prev" data-i18n-title="pv.prev" title="Önceki (Shift+Enter)"><svg viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"/></svg></button>
    <button tabindex="-1" class="pvs-btn" id="pv-search-next" data-i18n-title="pv.next" title="Sonraki (Enter)"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
    <button tabindex="-1" class="pvs-btn" id="pv-search-close" data-i18n-title="pv.close" title="Kapat (Esc)"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>
</main>

<footer id="statusbar">
  <span id="st-path" title="">Yeni dosya</span>
  <span class="spacer"></span>
  <span id="st-counts">0 kelime · 0 karakter</span>
  <span id="st-cursor">Satır 1, Sütun 1</span>
  <span id="st-save" class="saved">Kaydedildi</span>
</footer>

<!-- Ayarlar -->
<div class="modal-backdrop hidden" id="settings-backdrop">
  <div class="modal" id="settings-modal" role="dialog" aria-label="Ayarlar">
    <div class="modal-head">
      <h2 data-i18n="set.title">Ayarlar</h2>
      <button class="icon-btn" id="settings-close" data-i18n-title="set.close" title="Kapat (Esc)">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">

      <section class="settings-group" id="grp-general">
        <h3 data-i18n="set.general">Genel</h3>
        <div class="field">
          <label for="opt-uitheme" data-i18n="set.uiTheme">Uygulama teması</label>
          <select id="opt-uitheme">
            <option value="system" data-i18n="set.themeSystem">Sistem</option>
            <option value="light" data-i18n="set.themeLight">Açık</option>
            <option value="dark" data-i18n="set.themeDark">Koyu</option>
          </select>
        </div>
        <div class="field">
          <label for="opt-language" data-i18n="set.language">Dil</label>
          <select id="opt-language">
            <option value="system" data-i18n="set.langSystem">Sistem dili</option>
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
          </select>
        </div>
      </section>

      <section class="settings-group" id="grp-editor">
        <h3 data-i18n="set.editor">Editör</h3>
        <div class="field">
          <label for="ed-font-search" data-i18n="set.editorFont">Font (yalnızca monospace)</label>
          <div class="font-picker">
            <input type="text" id="ed-font-search" data-i18n-ph="set.fontSearch" placeholder="Font ara…" autocomplete="off">
            <div class="font-list" id="ed-font-list" tabindex="-1"></div>
          </div>
        </div>
        <div class="field">
          <label class="size-label"><span data-i18n="set.fontSize" data-i18n-arg="14">Font boyutu 14 px</span></label>
          <input type="range" id="ed-font-size" min="10" max="24" step="1">
        </div>
        <label class="check"><input type="checkbox" id="opt-linenumbers"> <span data-i18n="set.lineNumbers">Satır numaraları</span></label>
        <label class="check"><input type="checkbox" id="opt-wordwrap"> <span data-i18n="set.wordWrap">Uzun satırları kaydır</span></label>
      </section>

      <section class="settings-group" id="grp-preview">
        <h3 data-i18n="set.preview">Önizleme</h3>
        <div class="field">
          <label for="pv-font-search" data-i18n="set.previewFont">Font (sistemdeki tüm fontlar)</label>
          <div class="font-picker">
            <input type="text" id="pv-font-search" data-i18n-ph="set.fontSearch" placeholder="Font ara…" autocomplete="off">
            <div class="font-list" id="pv-font-list" tabindex="-1"></div>
          </div>
        </div>
        <div class="field">
          <label class="size-label"><span data-i18n="set.fontSize" data-i18n-arg="15">Font boyutu 15 px</span></label>
          <input type="range" id="pv-font-size" min="11" max="28" step="1">
        </div>
        <div class="field">
          <label data-i18n="set.theme">Tema</label>
          <div class="theme-grid" id="theme-grid"></div>
        </div>
        <label class="check"><input type="checkbox" id="opt-showpreview"> <span data-i18n="set.showPreview">Önizlemeyi göster</span></label>
        <label class="check"><input type="checkbox" id="opt-syncscroll"> <span data-i18n="set.syncScroll">Editör ile eşzamanlı kaydırma</span></label>
      </section>

      <section class="settings-group" id="grp-save">
        <h3 data-i18n="set.saving">Kaydetme</h3>
        <label class="check"><input type="checkbox" id="opt-autosave"> <span data-i18n="set.autosave">Otomatik kaydet</span></label>
        <div class="field">
          <label class="size-label"><span data-i18n="set.autosaveDelay" data-i18n-arg="2">Yazmayı bıraktıktan 2 sn sonra kaydet</span></label>
          <input type="range" id="opt-autosave-delay" min="0.5" max="10" step="0.5">
        </div>
      </section>

    </div>
  </div>
</div>

<!-- Kaydetme onayı -->
<div class="modal-backdrop hidden" id="confirm-backdrop">
  <div class="modal small" role="dialog">
    <p id="confirm-text"></p>
    <div class="modal-actions">
      <button class="btn" id="confirm-cancel" data-i18n="cf.cancel">İptal</button>
      <button class="btn danger" id="confirm-discard" data-i18n="cf.discard">Kaydetmeden kapat</button>
      <button class="btn primary" id="confirm-save" data-i18n="cf.save">Kaydet</button>
    </div>
  </div>
</div>

<!-- Tek satır girişi (bağlantı/resim adresi) -->
<div class="modal-backdrop hidden" id="prompt-backdrop">
  <div class="modal small" role="dialog">
    <p id="prompt-text" style="padding-top:18px"></p>
    <div style="padding:0 18px">
      <input type="text" id="prompt-input" autocomplete="off" style="width:100%">
    </div>
    <div class="modal-actions" style="padding-top:18px">
      <button class="btn" id="prompt-cancel" data-i18n="cf.cancel">İptal</button>
      <button class="btn primary" id="prompt-ok" data-i18n="cf.ok">Tamam</button>
    </div>
  </div>
</div>

<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/meta.min.js"></script>
<script src="vendor/codemirror/overlay.min.js"></script>
<script src="vendor/codemirror/markdown.min.js"></script>
<script src="vendor/codemirror/gfm.min.js"></script>
<script src="vendor/codemirror/continuelist.min.js"></script>
<script src="vendor/codemirror/active-line.min.js"></script>
<script src="vendor/codemirror/searchcursor.min.js"></script>
<script src="vendor/markdown-it/markdown-it.min.js"></script>
<script src="vendor/highlight.js/highlight.min.js"></script>
<script src="js/bridge.js"></script>
<script src="js/i18n.js"></script>
<script src="js/settings.js"></script>
<script src="js/preview.js"></script>
<script src="js/editor.js"></script>
<script src="js/edsearch.js"></script>
<script src="js/sync.js"></script>
<script src="js/search.js"></script>
<script src="js/tabs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
